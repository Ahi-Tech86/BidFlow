server:
  port: ${BIDDING_SERVICE_PORT}

spring:
  application:
    name: bidding-service

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${DB_BIDDING}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${BIDDING_CACHE_DATABASE:0}
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1s

  cache:
    type: redis

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: http://localhost:${EUREKA_SERVER_PORT}/eureka

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
      base-path: /actuator

  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
    env:
      enabled: false
    beans:
      enabled: false
    configprops:
      enabled: false
    threaddump:
      enabled: false
    heapdump:
      enabled: false

info:
  app:
    name: Bidding Service
    description: Bidding Core
    version: 1.0.0