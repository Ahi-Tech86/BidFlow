server:
  port: ${AUTH_SERVICE_PORT}

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT}/${DB_AUTH}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${AUTH_CACHE_DATABASE:0}
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  cache:
    type: redis
    redis:
      time-to-live: 900000
      key-prefix: "auth:"
      use-key-prefix: true
      cache-null-values: false

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: http://localhost:${EUREKA_SERVER_PORT}/eureka

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
      base-path: /actuator

  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
    env:
      enabled: false
    beans:
      enabled: false
    configprops:
      enabled: false
    threaddump:
      enabled: false
    heapdump:
      enabled: false

info:
  app:
    name: Auth Service
    description: Authentication users
    version: 1.0.0

application:
  security:
    jwt:
      refresh-token:
        secret-key: ${REFRESH_TOKEN_SECRET_KEY}
        expiration: ${REFRESH_TOKEN_EXPIRATION}
      access-token:
        secret-key: ${ACCESS_TOKEN_SECRET_KEY}
        expiration: ${ACCESS_TOKEN_EXPIRATION}

    public-endpoints:
      - /api/v1/auth/register
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /actuator/health
      - /v3/api-docs/**
      - /swagger-ui/**